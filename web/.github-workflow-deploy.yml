# Deployment workflow for the new Next.js site (static export -> GitHub Pages).
#
# IMPORTANT: This file is parked here as `web/.github-workflow-deploy.yml` so it
# does NOT run yet. When you are ready to go live, move it to
# `.github/workflows/deploy.yml` at the REPOSITORY ROOT and commit.
#
# It is `workflow_dispatch` (manual) only, so it never deploys automatically.
# Configure the contact emails as repository secrets:
#   CONTACT_EMAIL_MARENNES, CONTACT_EMAIL_GUJAN
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://ets-bertrand.com
          NEXT_PUBLIC_CONTACT_EMAIL_MARENNES: ${{ secrets.CONTACT_EMAIL_MARENNES }}
          NEXT_PUBLIC_CONTACT_EMAIL_GUJAN: ${{ secrets.CONTACT_EMAIL_GUJAN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
